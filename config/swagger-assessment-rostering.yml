# Assessment rostering (provisional): merged into config/swagger.yml by
# src/config/swagger-document.js when ASSESSMENT_ROSTERING_ENABLED is true.

tags:
  - name: Assessment Rostering
    x-tag-meaning: set
    description: Provisional. Students registered for assessment sittings, from Ed-Fi assessment
      registration data (Data Standard 5.2 and later). The 1EdTech service name and version are not
      final, so the base path may change. Served only when ASSESSMENT_ROSTERING_ENABLED is true.
paths:
  /ims/oneroster/assessmentRostering/v1p0/assessments:
    get:
      tags:
        - Assessment Rostering
      summary: getAssessments
      description: Return collection of assessments.
      security:
        - oauth2_auth:
            - https://purl.imsglobal.org/spec/or/v1p2/scope/roster-core.readonly
        - oauth2_auth:
            - https://purl.imsglobal.org/spec/or/v1p2/scope/roster.readonly
      parameters:
        - name: fields
          in: query
          required: false
          schema:
            type: string
        - name: filter
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
        - name: orderBy
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        "200":
          description: Return collection of assessments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessments:
                    type: array
                    items:
                      $ref: "#/components/schemas/assessment"
        "404":
          description: Assessment rostering is not available for this data store, or the parent resource was
            not found.
  /ims/oneroster/assessmentRostering/v1p0/assessments/{id}:
    get:
      tags:
        - Assessment Rostering
      summary: getAssessment
      description: Return specific assessment.
      security:
        - oauth2_auth:
            - https://purl.imsglobal.org/spec/or/v1p2/scope/roster-core.readonly
        - oauth2_auth:
            - https://purl.imsglobal.org/spec/or/v1p2/scope/roster.readonly
      parameters:
        - name: id
          in: path
          required: true
          description: An identifier from [ims/oneroster/assessmentRostering/v1p0/assessments]
          x-source: getAssessments
          schema:
            type: string
      responses:
        "200":
          description: Return specific assessment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assessment:
                    $ref: "#/components/schemas/assessment"
        "404":
          description: Not found, not visible to the caller, or assessment rostering is not available for this
            data store.
  /ims/oneroster/assessmentRostering/v1p0/assessments/{id}/assessmentOfferings:
    get:
      tags:
