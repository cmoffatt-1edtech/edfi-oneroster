components:
  schemas:
    assessment:
      type: object
      required:
        - sourcedId
        - status
        - dateLastModified
        - title
        - identifier
      properties:
        sourcedId:
          description: 9877728989-ABF-0001
          type: string
        status:
          description: active
          type: string
          enum:
            - active
            - tobedeleted
        dateLastModified:
          description: 2012-04-23T18:25:43.511Z
          type: string
          format: date-time
        metadata:
          description: Ed-Fi values with no OneRoster field, under metadata.edfi
          type: object
        title:
          description: Ed-Fi Assessment.assessmentTitle
          type: string
        identifier:
          description: Ed-Fi Assessment.assessmentIdentifier (60 characters on Data Standard 5.2, 120 on 6.1)
          type: string
          maxLength: 120
        version:
          description: Ed-Fi Assessment.assessmentVersion
          type: string
        category:
          description: Code value of the Ed-Fi assessment category descriptor
          type: string
        subjects:
          description: Code values of the academic subject descriptors. Empty when there are none.
          type: array
          items:
            type: string
        grades:
          description: Assessed grade levels, mapped as for users.grades. Empty when there are none.
          type: array
          items:
            type: string
        org:
          description: The defining organization ("Defined by"). Absent when Ed-Fi has none, or when it is not
            an organization OneRoster publishes; its Ed-Fi id is then in metadata.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /orgs/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: org
              type: string
              enum:
                - org
        course:
          description: Linked course. Ed-Fi has no source, so absent in this version.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /courses/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: course
              type: string
              enum:
                - course
    assessmentOffering:
      type: object
      required:
        - sourcedId
        - status
        - dateLastModified
        - title
        - assessment
        - testingWindows
      properties:
        sourcedId:
          description: 9877728989-ABF-0001
          type: string
        status:
          description: active
          type: string
          enum:
            - active
            - tobedeleted
        dateLastModified:
          description: 2012-04-23T18:25:43.511Z
          type: string
          format: date-time
        metadata:
          description: Ed-Fi values with no OneRoster field, under metadata.edfi
          type: object
        title:
          description: Ed-Fi AssessmentAdministration.administrationIdentifier
          type: string
        assessment:
          description: The assessment this offering instantiates.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /assessments/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: assessment
              type: string
              enum:
                - assessment
        org:
          description: The assigning organization ("Offered by"). Absent when it is not an organization
            OneRoster publishes; its Ed-Fi id is then in metadata.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /orgs/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: org
              type: string
              enum:
                - org
        testingWindows:
          description: One entry per Ed-Fi administration period, ordered by start date; never merged. Empty
            when there are none.
          type: array
          items:
            type: object
            required:
              - startDate
            properties:
              startDate:
                description: 2021-12-01
                type: string
                format: date
              endDate:
                description: Null when the window is open-ended. 2021-12-01
                type: string
                format: date
                nullable: true
        class:
          description: Linked class. Absent in this version (open question Q4).
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /classes/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: class
              type: string
              enum:
                - class
        academicSession:
          description: Academic session. Absent in this version (open question Q5).
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /academicSessions/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: academicSession
              type: string
              enum:
                - academicSession
    assessmentEnrollment:
      type: object
      required:
        - sourcedId
        - status
        - dateLastModified
        - user
        - assessmentOffering
        - school
        - role
      properties:
        sourcedId:
          description: 9877728989-ABF-0001
          type: string
        status:
          description: active
          type: string
          enum:
            - active
            - tobedeleted
        dateLastModified:
          description: 2012-04-23T18:25:43.511Z
          type: string
          format: date-time
        metadata:
          description: Ed-Fi values with no OneRoster field, under metadata.edfi
          type: object
        user:
          description: The registered student, as in the users endpoint.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /users/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: user
              type: string
              enum:
                - user
        assessmentOffering:
          description: The offering the student is registered for.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /assessmentOfferings/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: assessmentOffering
              type: string
              enum:
                - assessmentOffering
        school:
          description: The school of the registration's student school association.
          type: object
          nullable: true
          required:
            - href
            - sourcedId
            - type
          properties:
            href:
              description: /orgs/9877728989-ABF-0001
              type: string
            sourcedId:
              description: 9877728989-ABF-0001
              type: string
            type:
              description: org
              type: string
              enum:
                - org
        role:
          description: Ed-Fi registers students only, so always student.
          type: string
          enum:
            - student
        beginDate:
          description: Ed-Fi registrations have no dates, so absent.
          type: string
          format: date
        endDate:
          description: Ed-Fi registrations have no dates, so absent.
          type: string
          format: date
