# OneRoster on Ed-Fi API v8 (DMS): runs the service from this repository on the DMS compose
# network, where the Configuration Service and the data-store database resolve by name
# (connection strings from CMS name hosts such as dms-postgresql).
# Use stack/start-dms-services.ps1 and stop-dms-services.ps1 (see README.md in this folder).
name: oneroster-dms

services:
  oneroster-dms:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: ${ONEROSTER_IMAGE:-edfi-oneroster:dms-local}
    container_name: oneroster-dms
    user: appuser
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    env_file: ${ONEROSTER_DMS_ENV_FILE:-.env.dms}
    ports:
      - "127.0.0.1:${ONEROSTER_DMS_PORT:-3200}:3000"
    networks:
      - dms
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health-check"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  dms:
    external: true
    name: ${DMS_NETWORK:-dms}
